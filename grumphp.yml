grumphp:
  ascii:
    failed: vendor/pixelfederation/coding-standards/assets/grumphp/pixel-bad.txt
    succeeded: vendor/pixelfederation/coding-standards/assets/grumphp/pixel-good.txt
  stop_on_failure: false
  fixer:
    enabled: false
  process_timeout: 600
  git_hook_variables:
    EXEC_GRUMPHP_COMMAND: './bin/grumphp_hooks/environment_spinup && docker exec -t circuit-breaker-bundle-php-min'
  testsuites:
    php8.4:
      tasks: &tasks
        - phpcs
        - phpcsfixer2
        - phplint
        - phpparser
        - phpstan
        - phpunit
        - psalm
        - xmllint_extended
        - yamllint
    php8.5:
      tasks: *tasks
  tasks:
    composer: ~
    composer_normalize: ~
    phpcs:
      standard: 'phpcs.ruleset.xml'
      tab_width: 4
      whitelist_patterns: [ ]
      encoding: utf-8
      ignore_patterns:
        - tests/
      sniffs: [ ]
      triggered_by: [ php ]
    phpcsfixer2:
      cache_file: '.php-cs-fixer.cache'
      allow_risky: true
      config: '.php-cs-fixer.php'
      using_cache: true
      config_contains_finder: true
      verbose: false
      diff: true
      triggered_by: [ 'php' ]
    phplint: ~
    phpparser:
      ignore_patterns:
        - tests/
        - src/Bridge/Symfony/Command/GenerateCircuitBrokenProxiesCacheWarmer.php
      kind: php83
      visitors:
        declare_strict_types: ~
        no_exit_statements: ~
        never_use_else: ~
        forbidden_function_calls:
          blacklist:
            - 'var_dump'
        forbidden_static_method_calls:
          blacklist:
            - 'Dumper::dump'
      triggered_by: [ php ]
    phpstan:
      autoload_file: ~
      configuration: 'phpstan.neon'
      memory_limit: "-1"
      level: max
      ignore_patterns:
        - tests/
      triggered_by: [ 'php' ]
    phpunit: ~
    psalm:
      config: psalm.xml
      ignore_patterns:
        - vendor
      no_cache: false
      report: ~
      triggered_by: [ 'php' ]
      show_info: true
    xmllint_extended:
      ignore_patterns: [ ]
      load_from_net: true
      x_include: true
      dtd_validation: true
      scheme_validation: true
      triggered_by: [ 'xml' ]
    yamllint:
      parse_constant: true
      parse_custom_tags: true
  extensions:
    - PixelFederation\CodingStandards\GrumPHP\ExtensionLoader
